plugins { id 'com.android.application' }

configurations.configureEach {
    resolutionStrategy.eachDependency { dependency ->
        if (dependency.requested.group == 'org.jetbrains.kotlin') {
            dependency.useVersion '1.8.22'
            dependency.because 'Keep Kotlin standard-library modules on one version to avoid duplicate classes.'
        }
    }
}

android { namespace 'com.courtlevel.app'; compileSdk 35
    defaultConfig { applicationId 'com.courtlevel.app'; minSdk 24; targetSdk 35; versionCode 1; versionName '0.0.1' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
